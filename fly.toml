app = "codealive-mail"        # change this to your app name on Fly.io
primary_region = "sin"        # Singapore — closest to India, change if needed

[build]
  # Fly.io auto-detects Python from requirements.txt

[http_service]
  internal_port = 8000
  force_https   = true         # all traffic is HTTPS, no plain HTTP
  auto_stop_machines  = true
  auto_start_machines = true

[[vm]]
  memory = "256mb"
  cpus   = 1
